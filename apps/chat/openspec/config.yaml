schema: spec-driven

context: |
  This planning root manages only the chat application in store creative-studio-chat.
  It is apps/chat in the creative-studio central repository. Source code and tests
  belong in external implementation repositories.
  Keep the canonical specification consolidated at openspec/specs/chat/spec.md.
  Product requirements and actual implementation repositories have not yet been selected.
  Leave specs empty until requirements are confirmed; create the first canonical
  specification when its behavior change has been implemented, accepted, and archived.
  Change deltas use specs/chat/spec.md. Do not split specifications by small features prematurely.
  Read the central AGENTS.md and application README; supply their constraints to implementation sessions.
  This configuration does not inherit from sibling applications. Changes and archives belong to this store.
  Write documentation, specifications, and planning artifacts in precise English,
  preserving OpenSpec's required headings and SHALL/MUST keywords.
  Application-related commits MUST use the chat scope, including design, specification,
  documentation, configuration, task, and archive updates. Follow docs/commits.md
  in the central repository for inseparable multi-application changes.

rules:
  proposal:
    - Identify the chat behavior change, scope, non-goals, actual implementation repositories, and cross-repository dependencies. Mark unknown repositories as unconfirmed.
    - Cite the central Git revision actually inspected. Disclose uncommitted planning and record a committed revision before implementation handoff.
  specs:
    - Consolidate observable application behavior in specs/chat/spec.md with verifiable scenarios and the standard delta or canonical format as appropriate.
    - Use ADDED for new requirements and MODIFIED for existing requirements, retaining valid scenarios. Do not copy configuration rules into the specification.
  design:
    - Define repository responsibilities, contracts, compatibility, integration order, failure handling, and rollback.
  tasks:
    - Identify the target repository for each implementation task and include repository tests, integration acceptance, and verification evidence.
    - Describe external implementation work only. Do not plan application source code in this central repository, and check off tasks only after successful verification.

operations:
  apply:
    guidance:
      - This store is the planning root only. Identify the implementation repository, execute only its assigned tasks, and record completion evidence in the central change.
      - Confirm an unspecified or inaccessible implementation repository before proceeding. Do not create application code under apps/chat.
  archive:
    guidance:
      - Verify implementation completion, tests, and integration acceptance across affected repositories, and record PRs and results before archiving.
      - Merge business deltas into this store's openspec/specs/chat/spec.md and archive the change under this store's changes/archive directory.
      - When committing an authorized archive update, use the chat application scope and reference its change ID.
